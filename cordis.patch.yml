# @dsh-external/dsh-web-search-openai bundle patch: inserts the dual-face
# plugin row into the web profile roster. Applied as a profile bundle layer
# (the `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:...` or npm install.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (registers the OpenAI Responses API `web_search`
# provider into `ctx.web`), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", served at /plugins/<id>/client.js)
# load in the web GUI.
- insert:
    - id: web-search-openai
      name: '@dsh-external/dsh-web-search-openai'
      config: {}
